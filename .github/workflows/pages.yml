name: Publication (site + aperçus)

# Publie sur GitHub Pages :
#   - la version officielle (branche main) à la racine du site ;
#   - un aperçu de chaque PR ouverte dans preview/pr-<numéro>/ (aucun commentaire n'est posté : pas d'e-mail GitHub).
# Se déclenche quand main change, et après chaque passage réussi des tests sur une PR.
# Les déploiements partent toujours du contexte de main (règle de l'environnement github-pages).
# Réglage requis une seule fois : Settings → Pages → Source → « GitHub Actions ».

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Tests]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assembler le site (officiel + aperçus des PR ouvertes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _site
          git archive main | tar -x -C _site
          rm -rf _site/tests _site/.github
          gh pr list -R "$GITHUB_REPOSITORY" --state open --json number,isCrossRepository \
            --jq '.[] | select(.isCrossRepository == false) | .number' > prs.txt
          while read -r n; do
            [ -z "$n" ] && continue
            git fetch -q origin "refs/pull/$n/head:pr-$n"
            mkdir -p "_site/preview/pr-$n"
            git archive "pr-$n" | tar -x -C "_site/preview/pr-$n"
            rm -rf "_site/preview/pr-$n/tests" "_site/preview/pr-$n/.github"
            echo "Aperçu de la PR #$n assemblé"
            echo "- PR #$n : https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/preview/pr-$n/" >> "$GITHUB_STEP_SUMMARY"
          done < prs.txt
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

